display_name: "Polars State"
package: polarstate
parser: numpy
repo: https://github.com/uriahf/polarstate
user_guide: user_guide
homepage: index
site_url: https://uriahf.github.io/polarstate/

github_style: widget
dark_mode_toggle: true
back_to_top: true
keyboard_nav: true
markdown_pages: true

site:
  css:
    - assets/uriah-docs/docs.css

accent_color:
  light: "#2f6f8f"
  dark: "#83bdd6"

logo: false
favicon: docs/logo.png
hero: false

nav_icons:
  navbar:
    User Guide: book-open
    API Reference: code-2
  sidebar:
    User Guide: book-open
    API Reference: code-2

source:
  enabled: true
  branch: master
  path: src/polarstate
  placement: usage

changelog:
  enabled: false

reference:
  title: "API Reference"
  desc: >-
    The complete public API for preparing time-to-event tables and predicting
    state-occupancy probabilities, with or without competing events.
  sections:
    - title: "Event table"
      desc: "Compute an inspectable Aalen-Johansen event table from time-to-event observations."
      contents:
        - prepare_event_table
    - title: "Time-horizon estimates"
      desc: "Return state-occupancy estimates at requested time horizons."
      contents:
        - predict_aj_estimates

