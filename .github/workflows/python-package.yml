name: Python package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtual environment
        run: uv venv

      - name: Run tests using uv
        run: uv run pytest tests

  r-validation:
    name: R Statistical Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install R and R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-cran-survival

      - name: Run R survival validation
        run: Rscript tests/r_validation_survival.R

      - name: Run Base-R empirical validation
        run: Rscript tests/r_validation_hmisc.R

  publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtual environment
        run: uv venv

      - name: Build package using uv
        run: uv build

      - name: Publish package using uv
        run: uv publish
